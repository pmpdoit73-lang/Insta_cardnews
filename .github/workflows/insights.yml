name: 통계 보고서 지금 받기

on:
  # 평소엔 poll.yml이 밤 9시 이후 하루 한 번 보냄. 지금 바로 받고 싶을 때 Actions에서 실행
  workflow_dispatch:

permissions:
  contents: write  # 날짜별 기록(state/insights.json) 저장

concurrency:
  group: insta-bot  # 초안 만들기와 버튼 확인이 동시에 돌지 않게
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 통계 보고서
        run: python src/insights.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          ISSUEPURI_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.ISSUEPURI_INSTAGRAM_ACCESS_TOKEN }}  # 없으면 건너뜀
          THREADS_PROMO_TOKEN: ${{ secrets.THREADS_PROMO_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_API_HOST: ${{ secrets.INSTAGRAM_API_HOST }}
      - name: 상태 저장
        if: always()
        run: |
          git config user.name "insta-cardnews-bot"
          git config user.email "insta-cardnews-bot@users.noreply.github.com"
          git add -A state/ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "통계 보고서 $(date -u +%Y%m%d-%H%M)"
          git pull --rebase origin main
          git push origin HEAD:main
