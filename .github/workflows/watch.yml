name: 릴스 보고 분석하기

on:
  workflow_dispatch:
    inputs:
      url:
        description: "참고할 릴스 링크 (instagram.com/reel/...)"
        required: true

permissions:
  contents: write  # 분석 결과(state/swipe.json) 저장

concurrency:
  group: insta-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt yt-dlp
      - name: 릴스 보고 분석
        run: python src/watch.py "$URL"
        env:
          URL: ${{ inputs.url }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: 결과 저장
        run: |
          git config user.name "insta-cardnews-bot"
          git config user.email "insta-cardnews-bot@users.noreply.github.com"
          git add -A state/ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "릴스 분석 $(date -u +%Y%m%d-%H%M)"
          git pull --rebase origin main
          git push origin HEAD:main
